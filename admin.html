<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Confirmações — Kauan & Karol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;padding:20px 14px 40px;color:#7A1325;font-family:"Cormorant Garamond",Georgia,serif;
 background:radial-gradient(circle at 15% 10%,rgba(201,112,122,.16),transparent 35%),#EFE6DB}
.caixa{width:min(100%,760px);margin:0 auto;padding:28px clamp(16px,4vw,32px);background:linear-gradient(180deg,#FBF7F1,#F4ECE2);
 border-radius:22px;box-shadow:0 20px 50px rgba(78,11,23,.15),inset 0 0 0 6px rgba(255,255,255,.55),inset 0 0 0 7px rgba(122,19,37,.1)}
h1{text-align:center;font:400 2.8rem/1 "Allura",cursive}
.sub{text-align:center;margin:4px 0 22px;font-style:italic;opacity:.8}
#login{display:flex;gap:8px;max-width:360px;margin:0 auto}
input{flex:1;padding:11px 13px;font:500 1.05rem "Cormorant Garamond",serif;color:#4E0B17;background:#fff;border:1px solid rgba(122,19,37,.25);border-radius:12px;outline:none}
input:focus{border-color:#7A1325}
button{padding:11px 20px;font:600 1rem "Cormorant Garamond",serif;color:#FBF4EC;background:#7A1325;border:0;border-radius:999px;cursor:pointer}
button.claro{color:#7A1325;background:none;border:1px solid rgba(122,19,37,.35)}
.erro{min-height:1.3em;margin-top:10px;text-align:center;color:#A3172F}
.totais{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.total{padding:14px 8px;text-align:center;background:rgba(255,255,255,.6);border:1px solid rgba(122,19,37,.15);border-radius:14px}
.total b{display:block;font:500 2.2rem/1 "Cormorant Garamond",serif}
.total span{font:600 .72rem/1 "Cormorant Garamond",serif;letter-spacing:.16em;text-transform:uppercase;opacity:.75}
.barra{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.barra input{min-width:250px}
.filtro button{padding:9px 14px}
.filtro button[aria-pressed="true"]{background:#7A1325;color:#FBF4EC}
.filtro button[aria-pressed="false"]{background:none;color:#7A1325;border:1px solid rgba(122,19,37,.3)}
ul{list-style:none;display:grid;gap:8px}
li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 14px;background:rgba(255,255,255,.65);border:1px solid rgba(122,19,37,.12);border-radius:14px}
li .nome{font-weight:600;font-size:1.12rem}
li .tag{align-self:start;padding:4px 10px;border-radius:999px;font:600 .8rem/1 "Cormorant Garamond",serif;white-space:nowrap}
li .sim{background:#7A1325;color:#FBF4EC}
li .nao{border:1px solid rgba(122,19,37,.35)}
li .info{grid-column:1/-1;font-size:.95rem;opacity:.8}
li .info a{color:inherit}
li .recado{grid-column:1/-1;font-style:italic;opacity:.9}
.vazio{text-align:center;padding:20px;opacity:.7;font-style:italic}
li{position:relative}
.excluir{grid-column:1/-1;justify-self:end;margin-top:6px;padding:6px 14px;font:600 .85rem "Cormorant Garamond",serif;
 color:#7A1325;background:none;border:1px solid rgba(122,19,37,.3);border-radius:999px;cursor:pointer;transition:.2s}
.excluir:hover{border-color:#7A1325}
.excluir.certeza{color:#FBF4EC;background:#A3172F;border-color:#A3172F}
.excluir:disabled{opacity:.6;cursor:wait}
li.saindo{animation:sair .35s ease forwards}
@keyframes sair{to{opacity:0;transform:translateX(30px);height:0;padding-block:0;margin:0}}
.aviso{position:fixed;left:50%;bottom:22px;translate:-50% 0;padding:11px 20px;border-radius:999px;color:#FBF4EC;background:#7A1325;
 font:600 .95rem "Cormorant Garamond",serif;box-shadow:0 10px 24px rgba(78,11,23,.3);opacity:0;transition:opacity .3s;pointer-events:none}
.aviso.ver{opacity:1}
[hidden]{display:none!important}
li .acomps{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:2px 0}
li .acomps small{font:600 .7rem/1 "Cormorant Garamond",serif;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
li .acomp{padding:3px 10px;font-size:.98rem;background:rgba(122,19,37,.06);border:1px solid rgba(122,19,37,.18);border-radius:999px}
li .acomp.achou{background:#7A1325;color:#FBF4EC;border-color:#7A1325}
li .acomps .falta{font-style:italic;opacity:.65}
li .acoes{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
li .acoes .excluir{margin-top:0}
.editar{padding:6px 14px;font:600 .85rem "Cormorant Garamond",serif;color:#7A1325;background:none;border:1px solid rgba(122,19,37,.3);border-radius:999px;cursor:pointer}
.editar:hover{border-color:#7A1325}
li .editado{font-style:italic;opacity:.75}
/* ===== Editar confirmação ===== */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(46,8,16,.55);backdrop-filter:blur(5px)}
.modal-caixa{position:relative;width:min(100%,440px);max-height:calc(100svh - 32px);overflow:auto;padding:26px 24px 22px;
 background:linear-gradient(180deg,#FBF7F1,#F4ECE2);border-radius:22px;box-shadow:0 30px 70px rgba(30,4,10,.45),inset 0 0 0 6px rgba(255,255,255,.55),inset 0 0 0 7px rgba(122,19,37,.12);
 animation:subir .3s cubic-bezier(.2,.8,.2,1)}
@keyframes subir{from{opacity:0;transform:translateY(16px) scale(.97)}}
.modal-caixa h2{text-align:center;font:400 2.3rem/1 "Allura",cursive}
.modal-caixa .sub{margin:4px 0 16px}
.modal-fechar{position:absolute;top:10px;right:12px;width:34px;height:34px;padding:0;font-size:1.6rem;line-height:1;color:#7A1325;background:none;opacity:.6}
#form-editar{display:grid;gap:12px}
#form-editar label,#form-editar legend{display:block;margin-bottom:5px;font:600 .72rem/1 "Cormorant Garamond",serif;letter-spacing:.16em;text-transform:uppercase;opacity:.8}
#form-editar input,#form-editar select,#form-editar textarea{width:100%;padding:10px 12px;font:500 1.05rem "Cormorant Garamond",serif;color:#4E0B17;background:#fff;border:1px solid rgba(122,19,37,.25);border-radius:12px;outline:none}
#form-editar textarea{height:64px;resize:none}
#form-editar input:focus,#form-editar select:focus,#form-editar textarea:focus{border-color:#7A1325}
#form-editar input.invalido{border-color:#A3172F;box-shadow:0 0 0 3px rgba(163,23,47,.12)}
#form-editar fieldset{border:0}
.opcoes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opcoes label{margin:0!important;opacity:1!important}
.opcoes input{position:absolute;opacity:0;pointer-events:none}
.opcoes span{display:block;padding:10px 8px;text-align:center;font:600 1rem/1.1 "Cormorant Garamond",serif;letter-spacing:0;text-transform:none;
 border:1px solid rgba(122,19,37,.25);border-radius:12px;background:rgba(255,255,255,.6);cursor:pointer}
.opcoes input:checked+span{background:#7A1325;color:#FBF4EC;border-color:#7A1325}
.opcoes input:focus-visible+span{box-shadow:0 0 0 3px rgba(122,19,37,.2)}
#e-acomps{display:grid;gap:10px}
#e-acomps:empty{display:none}
#e-acomps .obrig{margin-left:6px;font-style:italic;letter-spacing:0;text-transform:none;color:#A3172F}
.modal-botoes{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.modal-botoes button:disabled{opacity:.6;cursor:wait}
#e-erro{min-height:1.2em;text-align:center;color:#A3172F}
</style>
</head>
<body>
<main class="caixa">
  <h1>Kauan &amp; Karol</h1>
  <p class="sub">Lista de confirmações</p>

  <form id="login">
    <input id="senha" type="password" placeholder="Senha" autocomplete="current-password" required>
    <button>Entrar</button>
  </form>
  <p class="erro" id="erro"></p>

  <section id="painel" hidden>
    <div class="totais">
      <div class="total"><b id="t-pessoas">0</b><span>Pessoas</span></div>
      <div class="total"><b id="t-conf">0</b><span>Confirmados</span></div>
      <div class="total"><b id="t-nao">0</b><span>Não vão</span></div>
    </div>
    <div class="barra">
      <input id="busca" placeholder="Buscar nome ou acompanhante…">
      <div class="filtro">
        <button type="button" data-f="todos" aria-pressed="true">Todos</button>
        <button type="button" data-f="sim" aria-pressed="false">Vão</button>
        <button type="button" data-f="nao" aria-pressed="false">Não vão</button>
      </div>
      <button type="button" class="claro" id="csv">Baixar planilha</button>
      <button type="button" class="claro" id="lista-presenca">Lista de presença</button>
      <button type="button" class="claro" id="atualizar">Atualizar</button>
    </div>
    <ul id="lista"></ul>
  </section>
</main>
<div class="aviso" id="aviso" role="status"></div>

<div class="modal" id="modal-editar" hidden role="dialog" aria-modal="true" aria-labelledby="e-titulo">
  <div class="modal-caixa">
    <button type="button" class="modal-fechar" data-fechar aria-label="Fechar">&times;</button>
    <h2 id="e-titulo">Editar confirmação</h2>
    <p class="sub">As mudanças aparecem na lista e nas planilhas</p>
    <form id="form-editar" novalidate>
      <div><label for="e-nome">Nome completo</label><input id="e-nome" maxlength="80" autocomplete="off"></div>
      <div><label for="e-tel">WhatsApp</label><input id="e-tel" type="tel" inputmode="numeric" maxlength="16" placeholder="(11) 90000-0000"></div>
      <fieldset>
        <legend>Vai?</legend>
        <div class="opcoes">
          <label><input type="radio" name="e-vai" value="sim"><span>Vai</span></label>
          <label><input type="radio" name="e-vai" value="nao"><span>Não vai</span></label>
        </div>
      </fieldset>
      <div id="e-bloco-pessoas">
        <label for="e-pessoas">Quantas pessoas (contando quem confirmou)</label>
        <select id="e-pessoas"><option>1</option><option>2</option><option>3</option></select>
      </div>
      <div id="e-acomps"></div>
      <div><label for="e-recado">Recado</label><textarea id="e-recado" maxlength="300"></textarea></div>
      <p id="e-erro" role="alert"></p>
      <div class="modal-botoes">
        <button type="button" class="claro" data-fechar>Cancelar</button>
        <button type="submit" id="e-salvar">Salvar alterações</button>
      </div>
    </form>
  </div>
</div>

<script>
let dados = { lista: [], totais: {} }, filtro = "todos", senha = "";
try { senha = sessionStorage.getItem("kk-senha") || ""; } catch {}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const fone = t => t.length === 11 ? `(${t.slice(0,2)}) ${t.slice(2,7)}-${t.slice(7)}` : t;
// busca sem diferenciar maiúsculas e acentos ("joao" acha "João")
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const acompDe = c => Array.isArray(c.acompanhantes) ? c.acompanhantes.filter(Boolean) : [];

async function carregar() {
  $("erro").textContent = "";
  try {
    const r = await fetch("/api/lista", { headers: { "x-senha": senha } });
    const j = await r.json();
    if (!r.ok) throw new Error(j.erro);
    dados = j;
    try { sessionStorage.setItem("kk-senha", senha); } catch {}
    $("login").hidden = true; $("painel").hidden = false;
    desenhar();
  } catch (e) {
    $("erro").textContent = e.message || "Erro ao carregar.";
    $("login").hidden = false; $("painel").hidden = true;
  }
}

function desenhar() {
  $("t-pessoas").textContent = dados.totais.pessoas || 0;
  $("t-conf").textContent = dados.totais.confirmados || 0;
  $("t-nao").textContent = dados.totais.naoVao || 0;
  const q = norm($("busca").value.trim());
  const itens = dados.lista.filter(c => (filtro === "todos" || c.vai === filtro) &&
    (norm(c.nome).includes(q) || acompDe(c).some(n => norm(n).includes(q))));
  $("lista").innerHTML = itens.length ? itens.map(c => {
    const acomps = c.vai === "sim" ? acompDe(c) : [];
    const faltam = c.vai === "sim" ? Math.max(0, (Number(c.pessoas) || 1) - 1 - acomps.length) : 0;
    const blocoAcomp = acomps.length || faltam ? `
      <span class="acomps"><small>Acompanhantes</small>
        ${acomps.map(n => `<span class="acomp${q && norm(n).includes(q) ? " achou" : ""}">${esc(n)}</span>`).join("")}
        ${faltam ? `<span class="falta">${faltam === 1 ? "1 nome não informado" : `${faltam} nomes não informados`}</span>` : ""}
      </span>` : "";
    return `
    <li>
      <span class="nome">${esc(c.nome)}</span>
      <span class="tag ${c.vai}">${c.vai === "sim" ? "Presença confirmada ✓" : "Não vai"}</span>
      ${c.vai === "sim" ? `<span class="info"><b>${c.pessoas} ${c.pessoas == 1 ? "pessoa" : "pessoas"}</b></span>` : ""}
      ${blocoAcomp}
      <span class="info"><a href="https://wa.me/55${esc(c.telefone)}" target="_blank" rel="noopener">${esc(fone(c.telefone))}</a> · ${new Date(c.atualizadoEm).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" })}${c.editadoEm ? ` <span class="editado">· editado pelos noivos</span>` : ""}</span>
      ${c.recado ? `<span class="recado">“${esc(c.recado)}”</span>` : ""}
      <span class="acoes">
        <button type="button" class="editar" data-tel="${esc(c.telefone)}">Editar</button>
        <button type="button" class="excluir" data-tel="${esc(c.telefone)}" data-nome="${esc(c.nome)}">Excluir</button>
      </span>
    </li>`;
  }).join("") : `<p class="vazio">${q ? "Ninguém encontrado com esse nome." : "Nenhuma resposta por aqui ainda."}</p>`;
}

$("login").addEventListener("submit", e => { e.preventDefault(); senha = $("senha").value; carregar(); });
$("busca").addEventListener("input", desenhar);
$("atualizar").addEventListener("click", carregar);
document.querySelectorAll("[data-f]").forEach(b => b.addEventListener("click", () => {
  filtro = b.dataset.f;
  document.querySelectorAll("[data-f]").forEach(x => x.setAttribute("aria-pressed", x === b));
  desenhar();
}));
$("csv").addEventListener("click", () => {
  const linhas = [["Nome","WhatsApp","Vai","Pessoas","Acompanhante 1","Acompanhante 2","Recado","Data"],
    ...dados.lista.map(c => {
      const a = c.vai === "sim" ? acompDe(c) : [];
      return [c.nome, fone(c.telefone), c.vai === "sim" ? "Sim" : "Não", c.pessoas,
              a[0] || "", a[1] || "", c.recado || "", new Date(c.atualizadoEm).toLocaleString("pt-BR")];
    })];
  const csv = "﻿" + linhas.map(l => l.map(v => `"${String(v ?? "").replace(/^[=+\-@\t\r]/, "'$&").replace(/"/g, '""')}"`).join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = "confirmacoes-kauan-karol.csv"; a.click();
});

/* ===== Lista de presença (Excel com o logo K&K) ===== */
const CDN_EXCELJS = "https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js";
function carregarScript(src){
  return new Promise((ok, falha) => {
    if (window.ExcelJS) return ok();
    const s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = () => falha(new Error("Não foi possível carregar o gerador de planilha. Verifique a internet."));
    document.head.appendChild(s);
  });
}
async function logoBase64(){
  try {
    const r = await fetch("logo-kk.png"); if (!r.ok) return null;
    const b = new Uint8Array(await r.arrayBuffer()); let s = "";
    for (let i = 0; i < b.length; i += 8192) s += String.fromCharCode(...b.subarray(i, i + 8192));
    return btoa(s);
  } catch { return null; }
}

// o Excel não guarda fuso: grava a data já no horário de quem baixa a planilha
const horaLocal = d => { const t = new Date(d); return new Date(t.getTime() - t.getTimezoneOffset() * 60000); };

// Cada pessoa vira uma linha: quem confirmou e, logo abaixo, seus acompanhantes
function linhasPresenca(){
  const fam = dados.lista.filter(c => c.vai === "sim")
    .sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR", { sensitivity: "base" }));
  const linhas = [];
  fam.forEach((c, f) => {
    linhas.push({ nome: c.nome, familia: c.nome, tel: fone(c.telefone), titular: true, f });
    const a = acompDe(c), total = Math.max(1, Number(c.pessoas) || 1) - 1;
    for (let i = 0; i < total; i++)
      linhas.push({ nome: a[i] || "(nome não informado)", familia: c.nome, tel: "", titular: false, falta: !a[i], f });
  });
  return { fam, linhas };
}

async function gerarListaPresenca(){
  const VINHO = "FF7A1325", CREME = "FFF6F0E8", ROSA = "FFFBF1F2", LINHA = "FFE3C9CC";
  const wb = new ExcelJS.Workbook();
  wb.creator = "Kauan & Karol"; wb.created = new Date();
  const logo = await logoBase64();
  const idLogo = logo ? wb.addImage({ base64: logo, extension: "png" }) : null;
  const borda = { style: "thin", color: { argb: LINHA } };
  const bordas = { top: borda, left: borda, bottom: borda, right: borda };

  // Cabeçalho com logo, nomes, data e local (centralizado sobre as colunas)
  function cabecalho(ws, larguras, subtitulo, resumo){
    ws.columns = larguras.map(w => ({ width: w }));
    const n = larguras.length, ultima = String.fromCharCode(64 + n);
    for (let r = 1; r <= 9; r++) {
      ws.mergeCells(`A${r}:${ultima}${r}`);
      ws.getRow(r).getCell(1).alignment = { horizontal: "center", vertical: "middle" };
    }
    [1, 2, 3, 4, 5].forEach(r => ws.getRow(r).height = 17.5);
    if (idLogo != null) {
      // centraliza o logo (80 × 100 px) em pixels sobre a largura total das colunas
      const px = larguras.map(w => Math.round(w * 7 + 5)), total = px.reduce((s, v) => s + v, 0);
      let alvo = (total - 80) / 2, col = 0;
      while (col < px.length - 1 && alvo > px[col]) { alvo -= px[col]; col++; }
      ws.addImage(idLogo, { tl: { col: col + alvo / px[col], row: 0.2 }, ext: { width: 80, height: 100 }, editAs: "oneCell" });
    }
    const t = ws.getCell("A6"); t.value = "Kauan & Karol";
    t.font = { name: "Georgia", size: 24, italic: true, color: { argb: VINHO } }; ws.getRow(6).height = 34;
    const s = ws.getCell("A7"); s.value = subtitulo;
    s.font = { name: "Georgia", size: 12, bold: true, color: { argb: VINHO } }; ws.getRow(7).height = 20;
    const l = ws.getCell("A8"); l.value = "28/11/2026 às 15:00  ·  Rua pequeno romance 3";
    l.font = { name: "Georgia", size: 10.5, color: { argb: "FF9B2B3A" } };
    const z = ws.getCell("A9"); z.value = resumo;
    z.font = { name: "Georgia", size: 10, italic: true, color: { argb: "FF9B2B3A" } }; ws.getRow(9).height = 18;
    ws.getRow(10).height = 8;
  }
  function titulos(ws, nomes, linha){
    const r = ws.getRow(linha); r.values = nomes; r.height = 24;
    r.eachCell(c => {
      c.font = { name: "Georgia", size: 11, bold: true, color: { argb: CREME } };
      c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: VINHO } };
      c.alignment = { horizontal: "center", vertical: "middle" }; c.border = bordas;
    });
  }
  function impressao(ws, linhaTitulo, paisagem){
    ws.pageSetup = { paperSize: 9, orientation: paisagem ? "landscape" : "portrait", fitToPage: true, fitToWidth: 1, fitToHeight: 0,
      horizontalCentered: true, printTitlesRow: `${linhaTitulo}:${linhaTitulo}`,
      margins: { left: .4, right: .4, top: .5, bottom: .6, header: .2, footer: .3 } };
    ws.headerFooter.oddFooter = '&L&"Georgia,Italic"&9Kauan && Karol · 28/11/2026&R&"Georgia"&9Página &P de &N';
    ws.views = [{ state: "frozen", ySplit: linhaTitulo, showGridLines: false }];
  }

  // Aba 1: lista de presença para a recepção
  const { fam, linhas } = linhasPresenca();
  const ws = wb.addWorksheet("Lista de presença", { properties: { tabColor: { argb: VINHO } } });
  cabecalho(ws, [6, 34, 30, 18, 12], "Lista de presença",
    `${linhas.length} ${linhas.length === 1 ? "convidado" : "convidados"} · ${fam.length} ${fam.length === 1 ? "confirmação" : "confirmações"}`);
  titulos(ws, ["Nº", "Convidado", "Família", "WhatsApp", "Presença"], 11);
  linhas.forEach((p, i) => {
    const r = ws.getRow(12 + i);
    r.values = [i + 1, p.titular ? p.nome : `     ${p.nome}`, p.familia, p.tel, "☐"];
    r.height = 22;
    r.eachCell({ includeEmpty: true }, (c, k) => {
      c.border = bordas;
      c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: p.f % 2 ? ROSA : "FFFFFFFF" } };
      c.alignment = { vertical: "middle", horizontal: k === 1 || k === 5 ? "center" : "left" };
      c.font = { name: "Georgia", size: 11, color: { argb: "FF4E0B17" } };
    });
    r.getCell(2).font = { name: "Georgia", size: 11, bold: p.titular, italic: p.falta, color: { argb: p.falta ? "FF9B8A8C" : "FF4E0B17" } };
    r.getCell(3).font = { name: "Georgia", size: 10, color: { argb: "FF9B2B3A" } };
    r.getCell(5).font = { name: "Segoe UI Symbol", size: 15, color: { argb: VINHO } };
  });
  if (!linhas.length) { ws.mergeCells("A12:E12"); ws.getCell("A12").value = "Nenhuma presença confirmada ainda."; ws.getCell("A12").alignment = { horizontal: "center" }; }
  impressao(ws, 11, false);

  // Aba 2: todas as respostas (inclui quem não vai e os recados)
  const wr = wb.addWorksheet("Todas as respostas");
  const vao = dados.lista.filter(c => c.vai === "sim").length;
  cabecalho(wr, [26, 17, 8, 10, 22, 22, 40, 18], "Todas as respostas",
    `${dados.lista.length} respostas · ${vao} vão · ${dados.lista.length - vao} não vão`);
  titulos(wr, ["Nome", "WhatsApp", "Vai", "Pessoas", "Acompanhante 1", "Acompanhante 2", "Recado", "Data"], 11);
  dados.lista.forEach((c, i) => {
    const a = c.vai === "sim" ? acompDe(c) : [];
    const r = wr.getRow(12 + i);
    r.values = [c.nome, fone(c.telefone), c.vai === "sim" ? "Sim" : "Não", c.vai === "sim" ? Number(c.pessoas) || 1 : 0,
                a[0] || "", a[1] || "", c.recado || "", horaLocal(c.atualizadoEm)];
    r.eachCell({ includeEmpty: true }, (cel, k) => {
      cel.border = bordas;
      cel.fill = { type: "pattern", pattern: "solid", fgColor: { argb: i % 2 ? ROSA : "FFFFFFFF" } };
      cel.font = { name: "Georgia", size: 10.5, color: { argb: "FF4E0B17" } };
      cel.alignment = { vertical: "top", wrapText: k === 7, horizontal: k === 3 || k === 4 ? "center" : "left" };
    });
    if (c.vai !== "sim") r.getCell(3).font = { name: "Georgia", size: 10.5, italic: true, color: { argb: "FF9B8A8C" } };
    r.getCell(8).numFmt = "dd/mm/yyyy hh:mm";
  });
  impressao(wr, 11, true);

  const buf = await wb.xlsx.writeBuffer();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  a.download = "lista-de-presenca-kauan-karol.xlsx"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
$("lista-presenca").addEventListener("click", async () => {
  const b = $("lista-presenca"), texto = b.textContent;
  b.disabled = true; b.textContent = "Gerando…";
  try { await carregarScript(CDN_EXCELJS); await gerarListaPresenca(); avisar("Lista de presença baixada ✓"); }
  catch (e) { avisar(e.message || "Erro ao gerar a lista."); }
  finally { b.disabled = false; b.textContent = texto; }
});

/* ===== Editar confirmação ===== */
const Editar = (() => {
  const modal = $("modal-editar"), form = $("form-editar"), lista = $("e-acomps"), erro = $("e-erro");
  let original = null, memoria = [];
  const vai = () => form.querySelector('[name="e-vai"]:checked')?.value;
  const qtd = () => vai() === "sim" ? Math.max(0, Math.min(2, (parseInt($("e-pessoas").value, 10) || 1) - 1)) : 0;
  const mascara = v => { const d = v.replace(/\D/g, "").slice(0, 11);
    return d.length > 6 ? `(${d.slice(0,2)}) ${d.slice(2, d.length-4)}-${d.slice(-4)}` : d.length > 2 ? `(${d.slice(0,2)}) ${d.slice(2)}` : d; };

  function montar(){
    $("e-bloco-pessoas").hidden = vai() !== "sim";
    const n = qtd();
    if (lista.children.length === n) return;
    lista.innerHTML = "";
    for (let i = 0; i < n; i++) {
      const w = document.createElement("div");
      w.innerHTML = `<label for="e-acomp-${i}">Nome do ${i + 1}º acompanhante<span class="obrig">* obrigatório</span></label>
        <input id="e-acomp-${i}" data-i="${i}" maxlength="80" autocomplete="off">`;
      w.querySelector("input").value = memoria[i] || "";
      lista.appendChild(w);
    }
  }
  function abrir(tel){
    const c = dados.lista.find(x => x.telefone === tel); if (!c) return;
    original = c.telefone; memoria = [...acompDe(c)];
    $("e-nome").value = c.nome; $("e-tel").value = mascara(c.telefone); $("e-recado").value = c.recado || "";
    form.querySelector(`[name="e-vai"][value="${c.vai === "sim" ? "sim" : "nao"}"]`).checked = true;
    $("e-pessoas").value = String(Math.min(3, Math.max(1, Number(c.pessoas) || 1)));
    lista.innerHTML = ""; montar(); erro.textContent = "";
    modal.hidden = false; $("e-nome").focus();
  }
  function fechar(){ modal.hidden = true; original = null; }

  form.addEventListener("change", montar);
  form.addEventListener("input", () => { erro.textContent = ""; });
  lista.addEventListener("input", e => { if (e.target.dataset.i != null) { memoria[+e.target.dataset.i] = e.target.value; e.target.classList.remove("invalido"); } });
  $("e-tel").addEventListener("input", e => e.target.value = mascara(e.target.value));
  modal.addEventListener("click", e => { if (e.target === modal || e.target.closest("[data-fechar]")) fechar(); });
  addEventListener("keydown", e => { if (e.key === "Escape" && !modal.hidden) fechar(); });

  form.addEventListener("submit", async e => {
    e.preventDefault(); erro.textContent = "";
    const corpo = {
      telefoneOriginal: original,
      nome: $("e-nome").value.replace(/\s+/g, " ").trim(),
      telefone: $("e-tel").value,
      vai: vai(),
      pessoas: vai() === "sim" ? $("e-pessoas").value : "1",
      acompanhantes: [...lista.querySelectorAll("input")].map(i => i.value.replace(/\s+/g, " ").trim()),
      recado: $("e-recado").value,
    };
    if (corpo.nome.length < 3) return erro.textContent = "Informe o nome completo.";
    if (corpo.telefone.replace(/\D/g, "").length < 10) return erro.textContent = "Informe o WhatsApp com DDD.";
    const ins = lista.querySelectorAll("input");
    for (let i = 0; i < corpo.acompanhantes.length; i++)
      if (corpo.acompanhantes[i].length < 3) { ins[i].classList.add("invalido"); ins[i].focus(); return erro.textContent = `Informe o nome do ${i + 1}º acompanhante.`; }

    const b = $("e-salvar"); b.disabled = true; b.textContent = "Salvando…";
    try {
      const r = await fetch("/api/editar", { method: "POST", headers: { "Content-Type": "application/json", "x-senha": senha }, body: JSON.stringify(corpo) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.erro || "Não foi possível salvar.");
      fechar(); await carregar(); avisar("Alterações salvas ✓");
    } catch (err) { erro.textContent = err.message === "Failed to fetch" ? "Sem conexão. Tente novamente." : err.message; }
    finally { b.disabled = false; b.textContent = "Salvar alterações"; }
  });
  return { abrir };
})();
$("lista").addEventListener("click", e => { const b = e.target.closest(".editar"); if (b) Editar.abrir(b.dataset.tel); });

function avisar(t){const a=$("aviso");a.textContent=t;a.classList.add("ver");clearTimeout(avisar.t);avisar.t=setTimeout(()=>a.classList.remove("ver"),2600);}

// 1º toque: pede certeza · 2º toque (em até 4s): exclui
$("lista").addEventListener("click", async e => {
  const b = e.target.closest(".excluir"); if (!b) return;
  if (!b.classList.contains("certeza")) {
    document.querySelectorAll(".excluir.certeza").forEach(x => { x.classList.remove("certeza"); x.textContent = "Excluir"; });
    b.classList.add("certeza"); b.textContent = "Toque de novo para excluir";
    clearTimeout(b._t); b._t = setTimeout(() => { b.classList.remove("certeza"); b.textContent = "Excluir"; }, 4000);
    return;
  }
  clearTimeout(b._t); b.disabled = true; b.textContent = "Excluindo…";
  try {
    const r = await fetch("/api/excluir", { method: "POST", headers: { "Content-Type": "application/json", "x-senha": senha }, body: JSON.stringify({ telefone: b.dataset.tel }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok && r.status !== 404) throw new Error(j.erro || "Erro ao excluir.");
    const li = b.closest("li"); li.classList.add("saindo");
    setTimeout(carregar, 350);
    avisar(`${b.dataset.nome} foi excluído(a) da lista`);
  } catch (err) {
    b.disabled = false; b.classList.remove("certeza"); b.textContent = "Excluir";
    avisar(err.message);
  }
});

if (senha) carregar();
