<style>
:root {
  --vinho: #7A1325;
  --vinho-escuro: #4E0B17;
  --vinho-medio: #9B2B3A;
  --rosa: #C9707A;
  --rosa-claro: #E8B9BC;
  --papel: #F6F0E8;
  --papel-escuro: #EDE3D7;
  --fundo: #E9DFD3;
  --texto: #7A1325;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  padding: clamp(10px, 2vw, 24px);
  overflow-x: hidden;
  color: var(--texto);
  background:
    radial-gradient(circle at 18% 12%, rgba(201,112,122,.18), transparent 36%),
    radial-gradient(circle at 85% 90%, rgba(122,19,37,.12), transparent 34%),
    var(--fundo);
  font-family: "Cormorant Garamond", Georgia, serif;
  -webkit-font-smoothing: antialiased;
}
body.carta-abrindo { overflow: hidden; }
body.carta-abrindo .convite { opacity: 0; transform: translateY(70px) scale(.72); }
body.revelando-convite { overflow: hidden; }
body.revelando-convite .convite { animation: revelarPapel 1.45s cubic-bezier(.2,.78,.22,1) both; transform-origin: 50% 18%; }
body.convite-pronto .convite { opacity: 1; transform: none; }

/* Pétalas caindo (após o convite aparecer) */
.movimento-ambiente { position: fixed; inset: 0; z-index: 2; overflow: hidden; pointer-events: none; opacity: 0; transition: opacity 1.2s ease; }
body.convite-pronto .movimento-ambiente { opacity: 1; }
.petala-voo {
  position: absolute; top: -12vh; left: var(--x);
  width: var(--t); height: calc(var(--t) * 1.5);
  opacity: var(--o);
  background: radial-gradient(circle at 30% 30%, var(--rosa), var(--vinho) 75%);
  border-radius: 80% 0 80% 0;
  animation: cair var(--d) linear var(--a) infinite;
  animation-play-state: paused;
}
body.convite-pronto .petala-voo { animation-play-state: running; }
.petala-voo:nth-child(even) { border-radius: 0 80% 0 80%; background: radial-gradient(circle at 30% 30%, var(--rosa-claro), var(--vinho-medio) 80%); }
@keyframes cair {
  0% { translate: 0 -8vh; rotate: 0deg; }
  25% { translate: 28px 25vh; rotate: 110deg; }
  50% { translate: -22px 55vh; rotate: 220deg; }
  75% { translate: 30px 84vh; rotate: 330deg; }
  100% { translate: -10px 122vh; rotate: 450deg; }
}

/* ===== ABERTURA: envelope com selo de cera ===== */
.abertura-carta {
  position: fixed; inset: 0; z-index: 100;
  display: grid; place-items: center; overflow: hidden;
  background:
    radial-gradient(circle at 50% 44%, rgba(255,255,255,.7), transparent 40%),
    linear-gradient(160deg, #F3ECE4, #E6D9CB 60%, #DCCBBA);
  animation: sumirAbertura .8s ease 3.6s forwards;
  cursor: pointer;
}
.abertura-carta::before {
  content: ""; position: absolute; inset: 0; opacity: .25;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E");
  background-size: 150px;
}
.carta-palco {
  position: relative; width: min(80vw, 340px); height: 270px;
  perspective: 900px;
  filter: drop-shadow(0 24px 26px rgba(78,11,23,.28));
  animation: flutuar 2.4s ease-in-out infinite alternate;
}
@keyframes flutuar { from { transform: translateY(0); } to { transform: translateY(-6px); } }
.envelope-fundo {
  position: absolute; left: 0; right: 0; bottom: 0; height: 195px;
  background: #8E1D2E; border-radius: 8px 8px 16px 16px;
}
.carta-papel {
  position: absolute; z-index: 2; left: 7%; bottom: 16px; width: 86%; height: 190px;
  display: grid; place-items: center; align-content: center; gap: 6px;
  background: var(--papel);
  border-radius: 6px;
  box-shadow: 0 6px 16px rgba(0,0,0,.18);
  animation: retirarCarta 1.5s cubic-bezier(.2,.72,.24,1) 1.25s both;
}
.carta-papel .iniciais { font: 600 3.4rem/1 "Cormorant Garamond", serif; color: var(--vinho); letter-spacing: .06em; }
.carta-papel .iniciais i { display: inline-block; width: 1px; height: .9em; background: var(--vinho); margin: 0 .25em; vertical-align: -.1em; }
.carta-papel small { font: 400 1.6rem/1 "Allura", cursive; color: var(--vinho-medio); }
.envelope-aba {
  position: absolute; z-index: 4; left: 0; right: 0; bottom: 58px; height: 137px;
  background: linear-gradient(170deg, #A3283A, #7A1325);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: 50% 0; backface-visibility: hidden;
  animation: abrirEnvelope .9s cubic-bezier(.3,.02,.2,1) .55s both;
}
.envelope-frente {
  position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; height: 145px;
  background: linear-gradient(160deg, #94202F, #7A1325 55%, #5E0E1C);
  clip-path: polygon(0 0, 50% 50%, 100% 0, 100% 100%, 0 100%);
  border-radius: 0 0 16px 16px;
}
.envelope-frente::after {
  content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(35deg, rgba(255,255,255,.035) 0 1px, transparent 1px 6px);
}
/* selo de cera */
.selo-carta {
  position: absolute; z-index: 5; left: 50%; bottom: 52px;
  width: 58px; height: 58px; translate: -50% 0;
  display: grid; place-items: center;
  color: #F1D3C6;
  background: radial-gradient(circle at 35% 30%, #C24A5A, #8A1A2B 55%, #5A0B18);
  border-radius: 47% 53% 50% 50% / 52% 48% 52% 48%;
  box-shadow: inset 0 -3px 6px rgba(0,0,0,.35), inset 0 2px 4px rgba(255,255,255,.25), 0 4px 10px rgba(0,0,0,.3);
  font: 600 1rem/1 "Cormorant Garamond", serif; letter-spacing: .05em;
  animation: romperSelo .55s ease .3s both;
}
.selo-carta::before {
  content: ""; position: absolute; inset: 6px; border-radius: 50%;
  border: 1px dashed rgba(241,211,198,.55);
}
.abrindo-texto {
  position: absolute; top: calc(50% + 172px); left: 50%; translate: -50% 0; width: 100%;
  text-align: center; color: var(--vinho);
  font: 500 .8rem/1.4 "Cormorant Garamond", serif; letter-spacing: .3em; text-transform: uppercase;
  animation: pulsarTexto 1.4s ease-in-out infinite;
}
/* pétalas que estouram ao abrir */
.explosao { position: absolute; left: 50%; top: 50%; pointer-events: none; }
.explosao i {
  position: absolute; width: 10px; height: 15px; opacity: 0;
  background: radial-gradient(circle at 30% 30%, var(--rosa), var(--vinho));
  border-radius: 80% 0 80% 0;
  animation: estourar 1.6s cubic-bezier(.15,.7,.3,1) 2.2s both;
}
@keyframes estourar {
  0% { opacity: 0; transform: translate(0,0) rotate(0) scale(.4); }
  15% { opacity: .95; }
  100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(1); }
}
@keyframes abrirEnvelope { to { transform: rotateX(-178deg); z-index: 1; } }
@keyframes retirarCarta {
  0% { transform: translateY(0) scale(.96); }
  60% { transform: translateY(-160px) scale(1); }
  100% { transform: translateY(-125px) scale(1.12); }
}
@keyframes romperSelo {
  0% { opacity: 1; transform: scale(1); }
  40% { transform: scale(1.12); }
  100% { opacity: 0; transform: scale(.5) rotate(25deg); }
}
@keyframes pulsarTexto { 50% { opacity: .45; } }
@keyframes sumirAbertura { to { opacity: 0; visibility: hidden; pointer-events: none; } }
@keyframes revelarPapel {
  0% { opacity: 0; transform: translateY(90px) scale(.68) rotateX(12deg); filter: blur(7px); }
  58% { opacity: 1; transform: translateY(-10px) scale(1.025); filter: blur(0); }
  78% { transform: translateY(4px) scale(.992); }
  100% { opacity: 1; transform: none; filter: blur(0); }
}

/* ===== CONVITE ===== */
.convite {
  isolation: isolate; position: relative;
  width: min(100%, 680px);
  min-height: calc(100svh - clamp(20px, 4vw, 48px));
  margin: 0 auto;
  padding: clamp(60px, 9vh, 100px) clamp(22px, 7vw, 70px) clamp(70px, 10vh, 110px);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  overflow: hidden; text-align: center;
  background: linear-gradient(180deg, #F8F3EC, var(--papel) 50%, #F2EAE0);
  border-radius: clamp(18px, 4vw, 34px);
  box-shadow: 0 26px 70px rgba(78,11,23,.22), inset 0 0 80px rgba(201,112,122,.06);
}
.convite::before {
  content: ""; position: absolute; inset: 0; z-index: -3; opacity: .35;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.25'/%3E%3C/svg%3E");
  background-size: 145px; mix-blend-mode: multiply;
}

/* folhagem aquarela */
.floral { position: absolute; z-index: -1; width: clamp(190px, 46vw, 330px); height: auto; pointer-events: none; overflow: visible; }
.floral-topo { top: -30px; left: -40px; }
.floral-base { right: -40px; bottom: -34px; transform: rotate(180deg); }
.haste { fill: none; stroke: var(--vinho-escuro); stroke-width: 1.6; stroke-linecap: round; opacity: .6; }
.f1 { fill: var(--vinho); opacity: .85; }
.f2 { fill: var(--vinho-medio); opacity: .75; }
.f3 { fill: var(--rosa); opacity: .6; }
.f4 { fill: var(--vinho-escuro); opacity: .8; }
.baga { fill: var(--vinho-medio); opacity: .8; }
.floral path.folha { stroke: rgba(78,11,23,.35); stroke-width: .6; }
body.convite-pronto .floral-topo { animation: balancar 7s ease-in-out infinite alternate; transform-origin: 0 0; }
body.convite-pronto .floral-base { animation: balancarB 8s ease-in-out infinite alternate; transform-origin: 100% 100%; }
@keyframes balancar { to { transform: rotate(2.5deg); } }
@keyframes balancarB { from { transform: rotate(180deg); } to { transform: rotate(182.5deg); } }

.monograma {
  position: relative; display: grid; grid-template-columns: auto 1px auto; grid-template-rows: auto auto;
  column-gap: 12px; color: var(--vinho);
  font: 600 clamp(2.6rem, 10vw, 3.6rem)/1 "Cormorant Garamond", serif;
}
.monograma .k1 { grid-column: 1; grid-row: 1; }
.monograma .k2 { grid-column: 3; grid-row: 2; }
.monograma .linha { grid-column: 2; grid-row: 1 / 3; background: currentColor; }
.monograma .flor { position: absolute; left: 50%; top: 50%; width: 30px; translate: -50% -50%; }

.versiculo {
  width: min(100%, 440px); margin: clamp(18px, 3vh, 28px) auto 0;
  font: 400 clamp(1rem, 3.4vw, 1.2rem)/1.35 "Cormorant Garamond", serif;
}
.nomes {
  margin: clamp(14px, 3vh, 24px) 0 6px;
  font: 400 clamp(3.4rem, 15vw, 6.2rem)/1 "Allura", cursive;
  white-space: nowrap;
  text-shadow: 0 2px 10px rgba(122,19,37,.12);
}
.nomes .e { font-size: .7em; padding: 0 .1em; }
.chamada { font: 500 clamp(1rem, 3.5vw, 1.25rem)/1.35 "Cormorant Garamond", serif; }
.data {
  margin-top: clamp(18px, 3.5vh, 30px);
  font: 500 clamp(2rem, 9vw, 3.3rem)/1 "Caveat", cursive;
  display: flex; align-items: center; gap: .3em; flex-wrap: wrap; justify-content: center;
}
.data svg { width: .5em; height: .5em; fill: none; stroke: currentColor; stroke-width: 2.4; }
.data .as { font-size: .85em; }
.ramo-div { width: min(70%, 300px); margin: 10px auto 0; display: block; }
.ramo-div path { fill: none; stroke: var(--vinho); stroke-width: 1.2; stroke-linecap: round; }
.endereco { margin-top: clamp(16px, 3vh, 26px); font: 500 clamp(1rem, 3.4vw, 1.2rem)/1.35 "Cormorant Garamond", serif; }
.endereco strong { display: block; font-size: 1.15em; font-weight: 500; margin-top: 2px; }
.rsvp { margin-top: clamp(16px, 3vh, 26px); font: 500 clamp(.95rem, 3.2vw, 1.12rem)/1.4 "Cormorant Garamond", serif; }

@media (max-width: 480px) {
  body { padding: 8px; }
  .convite { padding-inline: 16px; }
}
@media (prefers-reduced-motion: no-preference) {
  body.convite-pronto .monograma, body.revelando-convite .monograma { animation: surgir .8s .3s ease both; }
  body.convite-pronto .nomes, body.revelando-convite .nomes { animation: surgir .9s .5s ease both; }
  body.convite-pronto .data, body.revelando-convite .data { animation: surgir .9s .7s ease both; }
  body.revelando-convite .ramo-div path { stroke-dasharray: 400; animation: desenhar 1.6s .9s ease both; }
  @keyframes surgir { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes desenhar { from { stroke-dashoffset: 400; } to { stroke-dashoffset: 0; } }
}
@media (prefers-reduced-motion: reduce) {
  .abertura-carta, .movimento-ambiente { display: none; }
}
.convite{width:min(100%,560px)!important;min-height:0!important;padding:0!important;display:block!important;}
.convite img{display:block;width:100%;height:auto;border-radius:inherit;}
.convite::before{display:none;}
body{display:grid;place-items:center;}

body{grid-auto-rows:min-content;align-content:center}


.convite{position:relative;container-type:inline-size}
.contagem{position:absolute;left:50%;top:89.3%;translate:-50% 0;width:auto;
 display:flex;align-items:baseline;justify-content:center;gap:1.1cqw;white-space:nowrap;
 color:#7A1325;font:500 2.9cqw/1 "Cormorant Garamond",serif;
 opacity:0;transition:opacity 1s .6s}
body.convite-pronto .contagem{opacity:1}
.contagem .titulo{font:400 4.8cqw/1 "Allura",cursive;margin-right:.6cqw}
.contagem b{font:600 3.6cqw/1 "Cormorant Garamond",serif;font-variant-numeric:lining-nums tabular-nums}
.contagem small{font-size:2.1cqw;letter-spacing:.12em;text-transform:uppercase;opacity:.8;margin-left:.4cqw}
.contagem .sep{opacity:.55;font-size:2.4cqw;display:inline-block;animation:batida 1.6s ease-in-out infinite}

/* ===== Animações extras ===== */
@keyframes batida{0%,100%{transform:scale(1)}15%{transform:scale(1.35)}30%{transform:scale(1)}45%{transform:scale(1.2)}}
.contagem b.vira{animation:virar .6s ease}
@keyframes virar{0%{transform:rotateX(0)}50%{transform:rotateX(90deg);opacity:.2}100%{transform:rotateX(0)}}
.contagem b{display:inline-block}
/* brilho que passa pelo papel */
.convite::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
 background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 48%,transparent 60%);
 background-size:260% 100%;background-position:150% 0;mix-blend-mode:soft-light;opacity:0}
body.convite-pronto .convite::after{opacity:1;animation:brilho 7s ease-in-out .3s infinite}
@keyframes brilho{0%{background-position:150% 0}35%,100%{background-position:-60% 0}}
/* inclinação 3D suave */
body.convite-pronto .convite{transform:perspective(1100px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .5s ease-out}
/* brilhos piscando */
.brilhinho{position:absolute;width:1.6cqw;height:1.6cqw;left:var(--x);top:var(--y);pointer-events:none;opacity:0;
 background:radial-gradient(circle,#fff 0 20%,rgba(255,215,220,.9) 35%,transparent 70%);
 clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%)}
body.convite-pronto .brilhinho{animation:piscar var(--d) ease-in-out var(--a) infinite}
@keyframes piscar{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:.95;transform:scale(1.2) rotate(45deg)}}
/* nomes com destaque pulsante (luz atrás) */
.aura{position:absolute;left:50%;top:26.5%;width:70%;height:9%;translate:-50% 0;pointer-events:none;
 background:radial-gradient(ellipse,rgba(201,112,122,.22),transparent 70%);opacity:0;filter:blur(6px)}
body.convite-pronto .aura{animation:aura 4s ease-in-out infinite}
@keyframes aura{0%,100%{opacity:.15;transform:scale(.9)}50%{opacity:.8;transform:scale(1.05)}}
/* corações subindo */
.coracao{position:absolute;bottom:-6vh;left:var(--x);font-size:var(--t);color:var(--vinho);opacity:0;
 animation:subir var(--d) ease-in var(--a) infinite;animation-play-state:paused}
body.convite-pronto .coracao{animation-play-state:running}
@keyframes subir{0%{opacity:0;transform:translateY(0) scale(.6)}10%{opacity:var(--o)}
 50%{transform:translate(18px,-55vh) scale(1)}90%{opacity:var(--o)}100%{opacity:0;transform:translate(-14px,-112vh) scale(1.1)}}
@media (prefers-reduced-motion: reduce){.convite::after,.brilhinho,.aura,.coracao{display:none}}
</style>
</head>

<script>
const abertura = document.getElementById("abertura-carta");
const convite = document.querySelector(".convite");
let finalizada = false;

// pétalas que estouram quando a carta sai do envelope
const explosao = document.getElementById("explosao");
for (let i = 0; i < 16; i++) {
  const p = document.createElement("i");
  const ang = (Math.PI * 2 * i) / 16 + Math.random() * .4;
  const dist = 120 + Math.random() * 110;
  p.style.setProperty("--dx", `${Math.cos(ang) * dist}px`);
  p.style.setProperty("--dy", `${Math.sin(ang) * dist - 60}px`);
  p.style.setProperty("--r", `${Math.random() * 540 - 270}deg`);
  p.style.animationDelay = `${2.2 + Math.random() * .25}s`;
  explosao.appendChild(p);
}

function concluir() {
  document.body.classList.remove("revelando-convite");
  document.body.classList.add("convite-pronto");
}
function finalizarAbertura() {
  if (finalizada) return;
  finalizada = true;
  document.body.classList.remove("carta-abrindo");
  abertura?.remove();
  document.body.classList.add("revelando-convite");
  convite.addEventListener("animationend", e => {
    if (e.target === convite && e.animationName === "revelarPapel") concluir();
  }, { once: true });
  setTimeout(concluir, 1700);
}

if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
  finalizada = true;
  document.body.classList.remove("carta-abrindo");
  document.body.classList.add("convite-pronto");
  abertura?.remove();
} else {
  abertura.addEventListener("animationend", e => {
    if (e.target === abertura && e.animationName === "sumirAbertura") finalizarAbertura();
  });
  abertura.addEventListener("click", finalizarAbertura); // toque pula a abertura
  setTimeout(finalizarAbertura, 4600);
}

/* ===== Contagem regressiva ===== */
const DATA_EVENTO = new Date("2026-11-28T15:00:00-03:00");
function atualizarContagem(){
  const el=document.getElementById("contagem");
  const agora=new Date(), fmt={timeZone:"America/Sao_Paulo"};
  if(agora.toLocaleDateString("pt-BR",fmt)===DATA_EVENTO.toLocaleDateString("pt-BR",fmt)){
    el.innerHTML='<span class="grande">É hoje! ♡</span>';return;}
  const ms=DATA_EVENTO-agora;
  if(ms<0){el.innerHTML='<span class="grande">Obrigado por fazer parte ♡</span>';return;}
  const d=Math.floor(ms/864e5),h=Math.floor(ms/36e5)%24,m=Math.floor(ms/6e4)%60;
  const b=(n,r)=>`<span><b>${String(n).padStart(2,"0")}</b><small>${r}</small></span>`;
  const antes=[...el.querySelectorAll('b')].map(x=>x.textContent);
  el.innerHTML='<span class="titulo">Faltam</span>'+b(d,d===1?"dia":"dias")+'<span class="sep">♡</span>'+b(h,"h")+'<span class="sep">♡</span>'+b(m,"min");
  el.querySelectorAll('b').forEach((x,i)=>{if(antes[i]&&antes[i]!==x.textContent)x.classList.add('vira');});
}
atualizarContagem(); setInterval(atualizarContagem,5000);

/* inclinação 3D com mouse / giroscópio */
const conviteEl=document.querySelector(".convite");
function inclinar(x,y){conviteEl.style.setProperty("--ry",(x*6).toFixed(2)+"deg");conviteEl.style.setProperty("--rx",(-y*6).toFixed(2)+"deg");}
if(!matchMedia("(prefers-reduced-motion: reduce)").matches){
  addEventListener("pointermove",e=>{if(e.pointerType==="mouse")inclinar(e.clientX/innerWidth-.5,e.clientY/innerHeight-.5);});
  addEventListener("pointerleave",()=>inclinar(0,0));
  addEventListener("deviceorientation",e=>{if(e.gamma==null)return;
    inclinar(Math.max(-1,Math.min(1,e.gamma/30))*.5,Math.max(-1,Math.min(1,(e.beta-45)/30))*.5);});
}

</script>
