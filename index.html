<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7A1325">
  <meta name="description" content="O site está fora do ar. Favor aguardar.">
  <title>O site está fora do ar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --vinho: #7A1325;
      --vinho-escuro: #4E0B17;
      --vinho-medio: #9B2B3A;
      --rosa: #C9707A;
      --rosa-claro: #E8B9BC;
      --papel: #F6F0E8;
      --fundo: #E9DFD3;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: clamp(12px, 3vw, 28px);
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--vinho);
      background:
        radial-gradient(circle at 18% 12%, rgba(201, 112, 122, .22), transparent 34%),
        radial-gradient(circle at 86% 88%, rgba(122, 19, 37, .16), transparent 38%),
        var(--fundo);
      font-family: "Cormorant Garamond", Georgia, serif;
      -webkit-font-smoothing: antialiased;
    }

    .cartao {
      position: relative;
      isolation: isolate;
      width: min(100%, 650px);
      min-height: min(760px, calc(100svh - 24px));
      padding: clamp(38px, 9vw, 78px) clamp(28px, 9vw, 82px);
      display: grid;
      place-content: center;
      text-align: center;
      overflow: hidden;
      border-radius: clamp(22px, 5vw, 36px);
      background: linear-gradient(180deg, #FBF7F1, var(--papel) 54%, #F1E6DA);
      box-shadow: 0 28px 70px rgba(78, 11, 23, .25), inset 0 0 80px rgba(201, 112, 122, .08);
      animation: surgir 1s cubic-bezier(.2, .78, .22, 1) both;
    }

    .cartao::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      opacity: .24;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.25'/%3E%3C/svg%3E");
      background-size: 145px;
      mix-blend-mode: multiply;
    }

    .cartao::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, .62) 49%, transparent 61%);
      background-size: 260% 100%;
      animation: brilho 7s ease-in-out 1s infinite;
    }

    .ramo {
      position: absolute;
      width: clamp(180px, 45vw, 320px);
      opacity: .86;
      pointer-events: none;
      animation: balancar 7s ease-in-out infinite alternate;
    }

    .ramo-topo { top: -24px; left: -38px; transform-origin: 0 0; }
    .ramo-base { right: -40px; bottom: -24px; transform: rotate(180deg); transform-origin: 100% 100%; animation-name: balancar-base; }
    .haste { fill: none; stroke: var(--vinho-escuro); stroke-width: 1.7; stroke-linecap: round; opacity: .6; }
    .folha { fill: var(--vinho); }
    .folha-clara { fill: var(--rosa); opacity: .72; }
    .flor { fill: var(--vinho-medio); opacity: .88; }

    .selo {
      width: 86px;
      height: 86px;
      margin: 0 auto clamp(22px, 5vw, 34px);
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #F7E7DE;
      background: radial-gradient(circle at 35% 30%, #C24A5A, #8A1A2B 56%, #5A0B18);
      border: 1px solid rgba(255, 242, 231, .35);
      box-shadow: inset 0 -4px 8px rgba(0, 0, 0, .3), inset 0 3px 5px rgba(255, 255, 255, .22), 0 10px 24px rgba(78, 11, 23, .23);
      font-size: 2.45rem;
      animation: pulsar 3.6s ease-in-out infinite;
    }

    .selo span { transform: translateY(-2px); }
    .sobretitulo { margin: 0 0 12px; font-size: .78rem; font-weight: 600; letter-spacing: .3em; text-transform: uppercase; }
    h1 { margin: 0; font: 400 clamp(3.7rem, 15vw, 6.5rem)/.86 "Allura", cursive; text-shadow: 0 2px 10px rgba(122, 19, 37, .12); }
    .divisor { width: min(210px, 66%); margin: clamp(23px, 5vw, 32px) auto; }
    .divisor path { fill: none; stroke: var(--vinho); stroke-width: 1.35; stroke-linecap: round; }
    .mensagem { max-width: 410px; margin: 0 auto; font-size: clamp(1.2rem, 4vw, 1.55rem); line-height: 1.35; }
    .mensagem strong { font-weight: 600; }
    .rodape { margin: clamp(26px, 6vw, 42px) 0 0; color: var(--vinho-medio); font-size: 1rem; font-style: italic; }

    .petala {
      position: fixed;
      top: -12vh;
      left: var(--x);
      width: var(--t);
      height: calc(var(--t) * 1.5);
      pointer-events: none;
      opacity: var(--o);
      background: radial-gradient(circle at 30% 30%, var(--rosa), var(--vinho) 75%);
      border-radius: 80% 0 80% 0;
      animation: cair var(--d) linear var(--a) infinite;
    }

    .petala:nth-child(even) { border-radius: 0 80% 0 80%; background: radial-gradient(circle at 30% 30%, var(--rosa-claro), var(--vinho-medio) 80%); }

    @keyframes surgir { from { opacity: 0; transform: translateY(34px) scale(.96); } to { opacity: 1; transform: none; } }
    @keyframes brilho { 0% { background-position: 150% 0; } 35%, 100% { background-position: -60% 0; } }
    @keyframes pulsar { 50% { transform: scale(1.05); box-shadow: inset 0 -4px 8px rgba(0,0,0,.3), inset 0 3px 5px rgba(255,255,255,.22), 0 12px 30px rgba(122,19,37,.32); } }
    @keyframes balancar { to { transform: rotate(2.5deg); } }
    @keyframes balancar-base { to { transform: rotate(182.5deg); } }
    @keyframes cair { 0% { translate: 0 -8vh; rotate: 0deg; } 25% { translate: 28px 25vh; rotate: 110deg; } 50% { translate: -22px 55vh; rotate: 220deg; } 75% { translate: 30px 84vh; rotate: 330deg; } 100% { translate: -10px 122vh; rotate: 450deg; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
      .petala { display: none; }
    }
  </style>
</head>
<body>
  <i class="petala" style="--x:7%;--t:10px;--o:.42;--d:13s;--a:0s"></i>
  <i class="petala" style="--x:22%;--t:8px;--o:.35;--d:16s;--a:3s"></i>
  <i class="petala" style="--x:45%;--t:11px;--o:.38;--d:14s;--a:5s"></i>
  <i class="petala" style="--x:70%;--t:9px;--o:.4;--d:15s;--a:1.5s"></i>
  <i class="petala" style="--x:92%;--t:12px;--o:.4;--d:17s;--a:4s"></i>

  <main class="cartao" aria-labelledby="titulo">
    <svg class="ramo ramo-topo" viewBox="0 0 300 220" aria-hidden="true"><path class="haste" d="M-10 20C95 35 95 139 263 214M54 37c-17 27-10 52 10 66M100 78c-20 23-15 50 6 68M151 123c-7 25 6 44 29 57"/><ellipse class="folha" cx="42" cy="45" rx="10" ry="27" transform="rotate(-34 42 45)"/><ellipse class="folha-clara" cx="68" cy="74" rx="10" ry="29" transform="rotate(52 68 74)"/><ellipse class="folha" cx="99" cy="87" rx="11" ry="30" transform="rotate(-25 99 87)"/><ellipse class="folha-clara" cx="125" cy="120" rx="10" ry="27" transform="rotate(57 125 120)"/><ellipse class="folha" cx="163" cy="133" rx="11" ry="29" transform="rotate(-22 163 133)"/><circle class="flor" cx="82" cy="53" r="8"/><circle class="flor" cx="173" cy="166" r="9"/><circle class="flor" cx="207" cy="185" r="6"/></svg>
    <svg class="ramo ramo-base" viewBox="0 0 300 220" aria-hidden="true"><path class="haste" d="M-10 20C95 35 95 139 263 214M54 37c-17 27-10 52 10 66M100 78c-20 23-15 50 6 68M151 123c-7 25 6 44 29 57"/><ellipse class="folha" cx="42" cy="45" rx="10" ry="27" transform="rotate(-34 42 45)"/><ellipse class="folha-clara" cx="68" cy="74" rx="10" ry="29" transform="rotate(52 68 74)"/><ellipse class="folha" cx="99" cy="87" rx="11" ry="30" transform="rotate(-25 99 87)"/><ellipse class="folha-clara" cx="125" cy="120" rx="10" ry="27" transform="rotate(57 125 120)"/><ellipse class="folha" cx="163" cy="133" rx="11" ry="29" transform="rotate(-22 163 133)"/><circle class="flor" cx="82" cy="53" r="8"/><circle class="flor" cx="173" cy="166" r="9"/><circle class="flor" cx="207" cy="185" r="6"/></svg>
    <div>
      <div class="selo" aria-hidden="true"><span>♡</span></div>
      <p class="sobretitulo">Bem-vindo</p>
      <h1 id="titulo">O site está<br>fora do ar</h1>
      <svg class="divisor" viewBox="0 0 220 32" aria-hidden="true"><path d="M2 16c34-1 53-13 83 0 10 5 18 5 25 0 30-13 49-1 108 0M102 17c4-10 12-14 18-11 5 3 2 11-4 11-7 0-7-9-2-15"/></svg>
      <p class="mensagem">Estamos realizando alguns ajustes. <strong>Favor aguardar.</strong></p>
    </div>
  </main>
</body>
</html>
